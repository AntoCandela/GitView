name: Repository verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            platform: macos-arm64
            architecture: arm64
          - runner: windows-2022
            platform: windows-x64
            architecture: x64
          - runner: ubuntu-24.04
            platform: ubuntu-24.04-x64
            architecture: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          architecture: ${{ matrix.architecture }}
          cache: npm
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      - name: Install Linux native prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf git
      - name: Check native runner architecture
        env:
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
        run: node --input-type=module -e "if (process.arch !== process.env.EXPECTED_ARCHITECTURE) process.exit(1)"
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Diagnose worker lifecycle failure
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/gitview-worker-diagnostic.mjs" <<'NODE'
          import { run } from 'node:test';
          const files = ['tests/infrastructure/agent-worker.test.mjs'];
          const codes = new Set(['EADDRINUSE', 'ECONNREFUSED', 'ERR_ASSERTION', 'ERR_TEST_FAILURE', 'ERR_INPUT_TYPE_NOT_ALLOWED', 'ENOENT']);
          const messages = new Set(['worker_web_not_ready', 'worker_port_busy', 'worker_child_failed', 'worker_dirty', 'worker_untracked_files', 'runtime exited before readiness']);
          for (let attempt = 0; attempt < 20 && !process.exitCode; attempt++) {
          for await (const event of run({ files, execArgv: [], testNamePatterns: ['worker lifecycle terminates POSIX'] })) {
            if (event.type !== 'test:fail') continue;
            const errors = [];
            for (let error = event.data.details?.error; error && errors.length < 4; error = error.cause) {
              errors.push({
                code: codes.has(error.code) ? error.code : 'other',
                category: messages.has(error.message) ? error.message : 'omitted',
                workerSourceLines: [...String(error.stack ?? '').matchAll(/agent-worker\.test\.mjs:(\d+):\d+/g)].map(match => Number(match[1])),
              });
            }
            console.log(JSON.stringify({ diagnostic: 'infrastructure_failure', errors }));
            process.exitCode = 1;
          }
          }
          console.log(JSON.stringify({ diagnostic: 'infrastructure_completed', passed: !process.exitCode }));
          NODE
          node "$RUNNER_TEMP/gitview-worker-diagnostic.mjs"
      - name: Run shared required verification
        if: ${{ !cancelled() }}
        run: node scripts/verify.mjs --suite all --output .verification/${{ matrix.platform }}
      - name: Upload sanitized verification manifest only
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-${{ matrix.platform }}-${{ github.sha }}
          path: .verification/${{ matrix.platform }}/manifest.json
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: true
